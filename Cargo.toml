[workspace]
resolver = "3"
members = ["crates/core", "clients/desktop/src-tauri", "clients/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
loadin-core = { path = "crates/core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
